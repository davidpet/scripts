<!DOCTYPE html>
<html>
  <head>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <sp-heading size="S">ExtractMotion</sp-heading>

    </div>
    <script src="js/main.js"></script>
  </body>
</html>
